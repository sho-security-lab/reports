name: Build and publish blog JSON

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s test -v
      - run: python scripts/build.py
      - name: Check publishing configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLISH_REPOSITORY: ${{ vars.PUBLISH_REPOSITORY }}
          DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
        run: |
          if [[ ! "$PUBLISH_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ -z "$DEPLOY_KEY" ]]; then
            echo 'Configure PUBLISH_REPOSITORY and PUBLISH_DEPLOY_KEY. See README.md.' >&2
            exit 1
          fi
          if [[ "${PUBLISH_REPOSITORY,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo 'Use a separate repository dedicated to public output.' >&2
            exit 1
          fi
      - name: Publish generated files to the public repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          external_repository: ${{ vars.PUBLISH_REPOSITORY }}
          publish_branch: main
          publish_dir: ./dist
          enable_jekyll: false
          force_orphan: true
          commit_message: Publish blog JSON
