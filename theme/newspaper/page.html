<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="color-scheme" content="light dark">
  <title>$page_title</title>
  <link rel="stylesheet" href="${prefix}theme.css">
</head>
<body class="$page_kind">
  <a class="skip" href="#main">$skip_label</a>
  <div class="layout">
    <header class="masthead">
      <div class="masthead-top"><span>An independent journal</span><a href="${prefix}./"$current>$posts_label</a></div>
      <a class="wordmark" href="${prefix}./">$site_title</a>
      <p class="masthead-description">$site_description</p>
      <div class="edition-line"><span>The journal edition</span><span class="edition-date">$edition_date</span><span>By $author</span></div>
    </header>
    <main id="main">$content</main>
    <footer class="site-footer"><a href="${prefix}./">$site_title</a><span>Independent words. Everyday stories.</span><span>Written by $author</span></footer>
  </div>
</body>
</html>
